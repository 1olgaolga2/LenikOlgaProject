name: Playwright Tests (manual)
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run tests on'
        required: false
        default: 'feature/playwright-tests'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # When run from the UI you can choose a branch; otherwise default 'branch' input will be used
        ref: ${{ github.event.inputs.branch || 'main' }}
    - name: Debug workflow inputs
      run: |
        echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
        echo "github.event_name=${{ github.event_name }}"
        echo "workflow input branch='${{ github.event.inputs.branch }}'"
        echo "effective checkout ref='${{ github.event.inputs.branch || 'main' }}'"
        if [ -z "${DEMO_PASSWORD}" ]; then
          echo "DEMO_PASSWORD: MISSING"
        else
          echo "DEMO_PASSWORD: PRESENT"
        fi
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Validate DEMO_PASSWORD secret
      run: |
        if [ -z "${DEMO_PASSWORD}" ]; then
          echo "ERROR: DEMO_PASSWORD secret is not set. Add it in repo Settings → Secrets → Actions." >&2
          exit 1
        fi
      env:
        DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
    - name: Run Playwright tests
      env:
        DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 30