name: Playwright Tests (on-demand)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run tests on'
        required: false
        default: 'feature/playwright-tests'
      test-filter:
        description: 'Test filter pattern (optional)'
        required: false
        default: ''

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout the specified branch (default: feature/playwright-tests)
          ref: ${{ github.event.inputs.branch || 'feature/playwright-tests' }}
      
      - name: Display workflow info
        run: |
          echo "=== Workflow Execution Info ==="
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.event.inputs.branch || 'feature/playwright-tests' }}"
          echo "Test Filter: ${{ github.event.inputs.test-filter }}"
          echo "Commit: ${{ github.sha }}"
          echo "================================"
      
      - name: Validate DEMO_PASSWORD secret
        run: |
          if [ -z "${DEMO_PASSWORD}" ]; then
            echo "⚠️ WARNING: DEMO_PASSWORD secret is not set"
            echo "Tests may fail if authentication is required"
            echo "Add it in repo Settings → Secrets and variables → Actions"
          else
            echo "✅ DEMO_PASSWORD secret is configured"
          fi
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Run Playwright tests
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.test-filter }}" ]; then
            npx playwright test ${{ github.event.inputs.test-filter }}
          else
            npx playwright test
          fi
      
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30