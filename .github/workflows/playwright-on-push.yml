name: Playwright Tests (push)

on:
  push:
    branches: [ main, feature/playwright-tests ]
    
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Validate DEMO_PASSWORD secret
        run: |
          if [ -z "${DEMO_PASSWORD}" ]; then
            echo "ERROR: DEMO_PASSWORD secret is not set. Add it in repo Settings → Secrets → Actions." >&2
            exit 1
          fi
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}

      - name: Run Playwright tests
        continue-on-error: true
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Prepare Pages artifact
        if: ${{ always() && !cancelled() }}
        run: |
          rm -rf _site
          mkdir -p _site
          # jeśli report nie istnieje (np. test padł zanim powstał), to nie wywalaj joba
          if [ -d "playwright-report" ]; then
            cp -r playwright-report/* _site/
          else
            echo "playwright-report folder not found"
          fi

      - name: Upload Pages artifact
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: test
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4