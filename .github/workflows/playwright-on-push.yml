name: Playwright Tests (push)
on:
  push:
    branches: [ main, feature/playwright-tests ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Validate DEMO_PASSWORD secret
      run: |
        if [ -z "${DEMO_PASSWORD}" ]; then
          echo "ERROR: DEMO_PASSWORD secret is not set. Add it in repo Settings → Secrets → Actions." >&2
          exit 1
        fi
      env:
        DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
    - name: Run Playwright tests
      env:
        DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        # Upload both the generated HTML report and raw test-results so traces/videos/screenshots are available
        path: |
          playwright-report/
          test-results/
        retention-days: 30
    
    - name: Deploy test report to GitHub Pages
      if: ${{ !cancelled() }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        destination_dir: playwright-report-${{ github.run_number }}
