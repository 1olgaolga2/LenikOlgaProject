name: Playwright Tests (push)


on:
  push:
    branches: [ main, feature/playwright-tests ]


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest


    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: lts/*


      - name: Install dependencies
        run: npm ci


      - name: Install Playwright Browsers
        run: npx playwright install --with-deps


      - name: Validate DEMO_PASSWORD secret
        run: |
          if [ -z "${DEMO_PASSWORD}" ]; then
            echo "ERROR: DEMO_PASSWORD secret is not set. Add it in repo Settings → Secrets → Actions." >&2
            exit 1
          fi
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}


      - name: Run Playwright tests
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: npx playwright test


      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Prepare Pages artifact
        if: ${{ !cancelled() }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r playwright-report/* _site/


      - name: Upload Pages artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site


  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
