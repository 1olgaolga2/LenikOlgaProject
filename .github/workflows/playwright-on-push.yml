name: Playwright Tests (push)

on:
  push:
    branches: [ main, feature/playwright-tests ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Validate DEMO_PASSWORD secret
        run: |
          if [ -z "${DEMO_PASSWORD}" ]; then
            echo "ERROR: DEMO_PASSWORD secret is not set. Add it in repo Settings → Secrets → Actions." >&2
            exit 1
          fi
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}

      - name: Run Playwright tests (shard)
        continue-on-error: true
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=blob

      - name: Upload blob report (for merge)
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 30

      # (opcjonalnie) zostawiam: artefakty diagnostyczne per shard
      - name: Upload test artifacts (per shard)
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shardIndex }}-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  merge-report:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: all-blob-reports

      - name: Merge reports to HTML
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r playwright-report/* _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: merge-report
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4